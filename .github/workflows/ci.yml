name: Avatar Vision — privacy-safe code checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install public test dependencies
        run: pip install -e '.[test,vision]'
      - name: Test synthetic fixtures
        run: pytest -q
      - name: Verify feature documentation and synthetic visual are reproducible
        run: |
          python scripts/build_feature_dictionary.py --check
          python scripts/create_visual_demo.py --check
          python scripts/demo_synthetic.py > /dev/null
      - name: Verify historical notebooks do not contain outputs
        run: python scripts/audit_notebooks.py
      - name: Verify no research datasets or artwork were committed
        run: python scripts/scan_public_release.py
      - name: Compile public utilities
        run: python -m compileall -q src scripts tests
